<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bypass Tool - Viền Vàng Nền Trắng</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f0f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Khung chính: viền vàng, nền trắng */
        .container {
            background: #ffffff;
            border: 4px solid #FFD700;
            border-radius: 12px;
            padding: 25px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        h1 {
            text-align: center;
            color: #B8860B;
            font-size: 22px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-bottom: 20px;
        }

        /* Danh sách dịch vụ */
        .services {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .service-item {
            background: #ffffff;
            border: 2px solid #FFD700;
            color: #B8860B;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
            font-weight: 600;
        }

        .service-item:hover {
            background: #FFF8DC;
        }

        .service-item.selected {
            background: #FFD700;
            color: #000;
            border-color: #B8860B;
        }

        /* Ô nhập link */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #B8860B;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: #ffffff;
            border: 2px solid #FFD700;
            border-radius: 8px;
            color: #333;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #B8860B;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .input-group input::placeholder {
            color: #bbb;
        }

        /* Nút bấm */
        .btn-bypass {
            width: 100%;
            padding: 14px;
            background: #FFD700;
            border: 2px solid #B8860B;
            border-radius: 8px;
            color: #000;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-bypass:hover:not(:disabled) {
            background: #FFC700;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 215, 0, 0.6);
        }

        .btn-bypass:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Bảng trạng thái */
        .status-panel {
            margin-top: 20px;
            background: #ffffff;
            border: 2px solid #FFD700;
            border-radius: 8px;
            padding: 16px;
            display: none;
        }

        .status-panel.visible {
            display: block;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #FFD700;
        }

        .status-title {
            font-size: 12px;
            color: #B8860B;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .status-info {
            font-size: 11px;
            color: #999;
        }

        .status-log {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.8;
            color: #666;
            max-height: 250px;
            overflow-y: auto;
        }

        .status-log .log-line {
            padding: 2px 0;
        }

        .status-log .log-line.done {
            color: #228B22;
            font-weight: 600;
        }

        .status-log .log-line.error {
            color: #ff0000;
            font-weight: 700;
        }

        .status-log .log-line.waiting {
            color: #B8860B;
        }

        /* Kết quả */
        .result-box {
            margin-top: 15px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }

        .result-box.visible {
            display: block;
        }

        .result-box.success {
            background: #FFFACD;
            border: 2px solid #FFD700;
        }

        .result-box.error {
            background: #FFF0F0;
            border: 2px solid #ff4444;
        }

        .result-box .result-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .result-box.success .result-label {
            color: #B8860B;
        }

        .result-box.error .result-label {
            color: #ff0000;
        }

        .result-box .result-content {
            font-size: 13px;
            word-break: break-all;
            line-height: 1.5;
        }

        .result-box.success .result-content a {
            color: #B8860B;
            text-decoration: none;
            font-weight: 600;
        }

        .result-box.success .result-content a:hover {
            text-decoration: underline;
        }

        .result-box.error .result-content {
            color: #ff0000;
            font-weight: 700;
        }

        /* Thanh tiến trình */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #FFF8DC;
            border-radius: 3px;
            margin-top: 12px;
            overflow: hidden;
            display: none;
            border: 1px solid #FFD700;
        }

        .progress-bar.visible {
            display: block;
        }

        .progress-bar .progress-fill {
            height: 100%;
            background: #FFD700;
            width: 0%;
            transition: width 1s linear;
        }

        /* Thông báo lỗi input */
        .input-error {
            color: #ff0000;
            font-size: 11px;
            margin-top: 4px;
            display: none;
            font-weight: 600;
        }

        .input-error.visible {
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ BYPASS TOOL</h1>
    <p class="subtitle">Chọn dịch vụ và dán link cần vượt</p>

    <!-- Danh sách dịch vụ -->
    <div class="services" id="serviceList">
        <div class="service-item" data-service="gtraffic">Gtraffic.io</div>
        <div class="service-item" data-service="link4m">Link4m</div>
        <div class="service-item" data-service="layma">Layma.net</div>
        <div class="service-item" data-service="traffic4k">Traffic4k.com</div>
        <div class="service-item" data-service="site2s">Site2s.com</div>
        <div class="service-item" data-service="bbmkt">Bbmkt.com</div>
        <div class="service-item" data-service="ontop">Ontop.link</div>
    </div>

    <!-- Ô nhập link -->
    <div class="input-group">
        <label for="urlInput">Dán URL của web cần vượt link</label>
        <input type="text" id="urlInput" value="https://" autocomplete="off" spellcheck="false">
        <div class="input-error" id="inputError">Vui lòng nhập link bắt đầu bằng https://</div>
    </div>

    <!-- Nút bypass -->
    <button class="btn-bypass" id="bypassBtn">🚀 Vượt Link</button>

    <!-- Thanh tiến trình -->
    <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- Bảng trạng thái -->
    <div class="status-panel" id="statusPanel">
        <div class="status-header">
            <span class="status-title">📡 Trạng thái</span>
            <span class="status-info" id="statusInfo">IP: -- | Thiết bị: --</span>
        </div>
        <div class="status-log" id="statusLog"></div>
    </div>

    <!-- Kết quả -->
    <div class="result-box" id="resultBox">
        <div class="result-label" id="resultLabel"></div>
        <div class="result-content" id="resultContent"></div>
    </div>
</div>

<script>
    // === CẤU HÌNH LINK ===
    const SERVICE_MAP = {
        'https://gtraffic.io/Yv2QaKD': {
            name: 'Gtraffic.io',
            result: 'https://pastefy.app/bbSrxKOk/raw'
        },
        'https://link4m.net/eYerc': {
            name: 'Link4m',
            result: 'https://www.mediafire.com/file/yqefvmq4mefu7h5/Minecraft_PE_26.30_BANDISHARE.apk/file'
        },
        'https://layma.net/5ABkvpfQu': {
            name: 'Layma.net',
            result: 'https://www.mediafire.com/file/msusgfxw3xosdpl/AimLock+Bro.zip/file'
        },
        'https://bbmkts.com/go/Hfz47hy5': {
            name: 'Bbmkt.com',
            result: 'https://www.mediafire.com/file/i5eioodkjudzmty/hackff+menuFFM.zip/file'
        }
    };

    const STATUS_STEPS = [
        'Sẵn sàng',
        'Đang kiểm tra kết nối...',
        'Kết nối thành công!',
        'Đang tải module...',
        'Tải module hoàn tất!',
        'Đang giả lập bypass...',
        'Bỏ qua xác thực...',
        'Đang xác nhận...',
        'Bypass thành công!',
        'Bạn đã vượt qua giới hạn!'
    ];

    let selectedService = null;
    let isProcessing = false;

    const serviceList = document.getElementById('serviceList');
    const urlInput = document.getElementById('urlInput');
    const bypassBtn = document.getElementById('bypassBtn');
    const inputError = document.getElementById('inputError');
    const statusPanel = document.getElementById('statusPanel');
    const statusLog = document.getElementById('statusLog');
    const statusInfo = document.getElementById('statusInfo');
    const resultBox = document.getElementById('resultBox');
    const resultLabel = document.getElementById('resultLabel');
    const resultContent = document.getElementById('resultContent');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');

    // Khóa prefix https:// - người dùng không thể xóa
    const FIXED_PREFIX = 'https://';

    urlInput.addEventListener('keydown', (e) => {
        const cursorPos = urlInput.selectionStart;
        const selEnd = urlInput.selectionEnd;

        // Chặn xóa vào vùng prefix
        if ((e.key === 'Backspace' || e.key === 'Delete') && cursorPos <= FIXED_PREFIX.length) {
            if (e.key === 'Backspace' && cursorPos <= FIXED_PREFIX.length) {
                e.preventDefault();
            }
        }

        // Chặn chọn toàn bộ bao gồm prefix
        if (e.key === 'a' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            urlInput.setSelectionRange(FIXED_PREFIX.length, urlInput.value.length);
        }
    });

    urlInput.addEventListener('input', () => {
        // Đảm bảo luôn có prefix https://
        if (!urlInput.value.startsWith(FIXED_PREFIX)) {
            urlInput.value = FIXED_PREFIX + urlInput.value.replace(/^https?:\/\//i, '');
        }
        hideInputError();
        resetOutput();
    });

    // Chặn click/di chuyển con trỏ vào vùng prefix
    urlInput.addEventListener('click', () => {
        if (urlInput.selectionStart < FIXED_PREFIX.length) {
            urlInput.setSelectionRange(FIXED_PREFIX.length, FIXED_PREFIX.length);
        }
    });

    // === CHỌN DỊCH VỤ (chỉ chọn, KHÔNG điền link) ===
    serviceList.addEventListener('click', (e) => {
        const item = e.target.closest('.service-item');
        if (!item) return;

        document.querySelectorAll('.service-item').forEach(el => el.classList.remove('selected'));
        item.classList.add('selected');
        selectedService = item.dataset.service;

        // Không tự động điền link - chỉ reset output
        resetOutput();
    });

    // === NÚT BYPASS ===
    bypassBtn.addEventListener('click', async () => {
        if (isProcessing) return;

        const url = urlInput.value.trim();

        if (url === FIXED_PREFIX || url.length <= FIXED_PREFIX.length) {
            showInputError('Vui lòng nhập URL đầy đủ sau https://');
            return;
        }

        if (!url.startsWith(FIXED_PREFIX)) {
            showInputError('Chỉ chấp nhận link bắt đầu bằng https://');
            return;
        }

        if (!selectedService) {
            showInputError('Vui lòng chọn một dịch vụ ở trên.');
            return;
        }

        hideInputError();
        isProcessing = true;
        bypassBtn.disabled = true;
        bypassBtn.textContent = '⏳ Đang xử lý...';

        resetOutput();
        statusPanel.classList.add('visible');
        progressBar.classList.add('visible');

        statusInfo.textContent = `IP: ${generateFakeIP()} | Thiết bị: ${navigator.platform || 'Unknown'}`;

        for (let i = 0; i < STATUS_STEPS.length; i++) {
            await sleep(i === 0 ? 300 : 700 + Math.random() * 400);

            const line = document.createElement('div');
            line.className = 'log-line';

            if (i === 0 || i === STATUS_STEPS.length - 1) {
                line.classList.add('done');
            } else {
                line.classList.add('waiting');
            }

            line.textContent = `[${new Date().toLocaleTimeString()}] ${STATUS_STEPS[i]}`;
            statusLog.appendChild(line);
            statusLog.scrollTop = statusLog.scrollHeight;

            progressFill.style.width = `${((i + 1) / STATUS_STEPS.length) * 100}%`;

            if (i > 0) {
                const prevLines = statusLog.querySelectorAll('.log-line');
                if (prevLines[i - 1]) {
                    prevLines[i - 1].classList.remove('waiting');
                    prevLines[i - 1].classList.add('done');
                }
            }
        }

        // Chờ 15 giây
        await sleep(15000);

        const normalizedUrl = url.toLowerCase().replace(/\/+$/, '');
        const matchedKey = Object.keys(SERVICE_MAP).find(key => {
            const normalizedKey = key.toLowerCase().replace(/\/+$/, '');
            return normalizedUrl === normalizedKey || normalizedUrl.startsWith(normalizedKey);
        });

        const random = Math.random();
        const shouldError = random < 0.85;
        const should404 = random >= 0.85 && random < 1.0;

        if (matchedKey && !shouldError && !should404) {
            showSuccess(SERVICE_MAP[matchedKey]);
        } else if (should404) {
            showError('Error 404: Do not accept this action');
        } else if (shouldError) {
            showError('Lỗi kết nối thiết bị. Vui lòng kiểm tra kết nối mạng của bạn.');
        } else if (!matchedKey) {
            showError('Link không hợp lệ hoặc không được hỗ trợ. Vui lòng kiểm tra lại.');
        }

        isProcessing = false;
        bypassBtn.disabled = false;
        bypassBtn.textContent = '🚀 Vượt Link';
    });

    function showSuccess(service) {
        resultBox.className = 'result-box success visible';
        resultLabel.textContent = '✅ Kết quả';
        resultContent.innerHTML = `<a href="${service.result}" target="_blank" rel="noopener">${service.result}</a>`;

        const line = document.createElement('div');
        line.className = 'log-line done';
        line.textContent = `[${new Date().toLocaleTimeString()}] ✅ Bypass thành công! Link đã sẵn sàng.`;
        statusLog.appendChild(line);
        statusLog.scrollTop = statusLog.scrollHeight;
    }

    function showError(message) {
        resultBox.className = 'result-box error visible';
        resultLabel.textContent = '❌ Lỗi';
        resultContent.textContent = message;

        const line = document.createElement('div');
        line.className = 'log-line error';
        line.textContent = `[${new Date().toLocaleTimeString()}] ❌ ${message}`;
        statusLog.appendChild(line);
        statusLog.scrollTop = statusLog.scrollHeight;
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function resetOutput() {
        statusLog.innerHTML = '';
        resultBox.className = 'result-box';
        resultContent.innerHTML = '';
        resultLabel.textContent = '';
        progressFill.style.width = '0%';
        progressBar.classList.remove('visible');
        statusPanel.classList.remove('visible');
    }

    function showInputError(msg) {
        inputError.textContent = msg;
        inputError.classList.add('visible');
    }

    function hideInputError() {
        inputError.classList.remove('visible');
    }

    function generateFakeIP() {
        const octets = [];
        for (let i = 0; i < 4; i++) {
            octets.push(Math.floor(Math.random() * 255));
        }
        return octets.join('.');
    }
</script>

</body>
</html>
